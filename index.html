<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogos Northwind · Frontend Equipo 2</title>

    <!-- Bootstrap 5 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Menú principal: se muestra solo cuando hay sesión -->
    <nav id="navbar" class="navbar navbar-expand-md navbar-dark bg-dark d-none">
        <div class="container">
            <span class="navbar-brand">Northwind</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item"><a class="nav-link" href="#" data-view="inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-view="productos">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-view="categorias">Categorías</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-view="proveedores">Proveedores</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span id="userBadge" class="badge text-bg-secondary"></span>
                    <button id="btnLogout" type="button" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Aquí se dibuja cada pantalla -->
    <main id="app" class="container py-4"></main>

    <!-- Avisos (toasts) -->
    <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <!-- Bootstrap 5 (JS: menú, modales y avisos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Aplicación (módulos ES: requieren abrirse con Live Server, no con doble clic) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
